# Deploy: see README.md in this folder.
name = "evection-hook-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "SETTINGS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
DISCORD_CLIENT_ID = "REPLACE_WITH_YOUR_DISCORD_APPLICATION_ID"

# Secrets (never commit these) — set with:
#   npx wrangler secret put DISCORD_CLIENT_SECRET
#   npx wrangler secret put SESSION_SECRET      (any long random string, e.g. `openssl rand -hex 32`)
